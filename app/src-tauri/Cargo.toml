[package]
name = "zee"
version = "0.1.0"
description = "Zee, the Dropzone Zero desktop companion"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS. tray-icon and image-png: the
# menu bar icon that shows and hides Zee.
tauri = { version = "=2.12.1", features = ["macos-private-api", "tray-icon", "image-png"] }
# Reading the daemon's info file (already in the tree through tauri).
serde_json = "1"

# Resizing Zee's window in one step on macOS (fit_window in main.rs). Same
# versions Tauri already builds, so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
