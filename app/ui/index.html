<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zee</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="bubble" hidden aria-live="polite">
      <div id="bubble-resize" title="Drag to resize the bubble" aria-hidden="true"></div>
      <div id="bubble-body">
        <p id="message">Connecting to Dropzone Zero...</p>
        <div id="lists">
          <ul id="pending"></ul>
          <h2 id="recent-title" hidden>Recently filed</h2>
          <ul id="recent"></ul>
          <p id="empty" hidden>Nothing filed yet. New downloads show up here.</p>
        </div>
        <footer>
          <button id="undo" type="button" title="Put back everything the last run moved">Undo last</button>
          <button id="pause" type="button">Pause</button>
        </footer>
      </div>
    </section>

    <div id="stage">
      <span id="badge" aria-hidden="true"></span>
      <span id="zzz" aria-hidden="true">z<span>z</span><span>z</span></span>
      <button id="zee" class="sleeping" type="button" aria-label="Zee, the Dropzone Zero robot. Click for what's happening; drag to move.">
        <canvas id="robot" aria-hidden="true"></canvas>
      </button>
    </div>

    <script src="zee.js"></script>
    <script type="module" src="robot.js"></script>
  </body>
</html>
