<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zee</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="bubble" hidden aria-live="polite">
      <p id="message">Connecting to Dropzone Zero...</p>
      <ul id="pending"></ul>
      <h2 id="recent-title" hidden>Recently filed</h2>
      <ul id="recent"></ul>
      <footer>
        <button id="undo" type="button" title="Put back everything the last run moved">Undo last</button>
        <button id="pause" type="button">Pause</button>
      </footer>
    </section>

    <div id="stage">
      <div id="grip" data-tauri-drag-region title="Drag to move Zee"></div>
      <span id="badge" aria-hidden="true"></span>
      <span id="zzz" aria-hidden="true">z<span>z</span><span>z</span></span>
      <button id="zee" class="sleeping" type="button" aria-label="Zee. Click for what's happening.">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <g class="hand"><ellipse cx="166" cy="92" rx="14" ry="22" /></g>
          <g class="body">
            <ellipse cx="100" cy="122" rx="74" ry="68" />
            <ellipse cx="100" cy="92" rx="58" ry="54" />
            <ellipse class="belly" cx="100" cy="146" rx="38" ry="28" />
          </g>
          <g class="eyes open">
            <circle cx="76" cy="96" r="13" class="white" /><circle cx="76" cy="98" r="6" class="pupil" />
            <circle cx="124" cy="96" r="13" class="white" /><circle cx="124" cy="98" r="6" class="pupil" />
          </g>
          <g class="eyes closed">
            <path d="M64 98 Q76 106 88 98" /><path d="M112 98 Q124 106 136 98" />
          </g>
          <g class="eyes swirl">
            <path d="M76 96 m-9 0 a9 9 0 1 1 9 9 a5 5 0 1 1 -3 -6" />
            <path d="M124 96 m-9 0 a9 9 0 1 1 9 9 a5 5 0 1 1 -3 -6" />
          </g>
          <path class="mouth smile" d="M86 120 Q100 134 114 120" />
          <ellipse class="mouth chomp" cx="100" cy="126" rx="14" ry="10" />
          <g class="snack"><rect x="150" y="40" width="22" height="28" rx="3" /><path d="M155 49 h12 M155 55 h12 M155 61 h8" /></g>
        </svg>
      </button>
    </div>

    <script src="zee.js"></script>
  </body>
</html>
