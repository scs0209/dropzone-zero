<!doctype html>
<!--
  The DEV cover image (1000x420). A field of documents runs across the whole
  frame: scattered and tilted on the left, settling into a grid sorted by kind
  on the right. A scribble under the title straightens out the same way, and
  Zee stands where the mess turns into order, filing a page. Rebuild with: pnpm media:cover
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dropzone Zero cover</title>
    <style>
      * { margin: 0; }
      html, body { width: 1000px; height: 420px; overflow: hidden; background: #15191c; }
      svg { display: block; }
      #robot { position: absolute; left: 596px; top: 262px; width: 168px; height: 168px; }
      .title {
        font-family: "SF Pro Display", -apple-system, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600; letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body class="eating">
    <svg id="cover" width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
      <rect width="1000" height="420" fill="#15191c" />
      <g id="tiles"></g>
      <path id="line" fill="none" stroke="#5dcaa5" stroke-width="2" stroke-linecap="round" />
      <text class="title" x="500" y="226" text-anchor="middle" font-size="66" fill="#f1ebe2">Dropzone Zero</text>
    </svg>
    <script>
      // Seeded, so every render of the cover is the same picture.
      let seed = 20261020;
      const random = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const smooth = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      // Muted category colors; most documents stay neutral.
      const kinds = ["#b8644a", "#c79a45", "#7d9c7f", "#6f8ea6"];
      const svg = "http://www.w3.org/2000/svg";
      const tiles = document.getElementById("tiles");
      const W = 26, H = 34, dx = 40, dy = 48;
      const rows = [14, 62, 110, 286, 334, 382]; // the band in the middle is left for the title

      for (const y0 of rows) {
        for (let c = 0; c < 25; c++) {
          const x0 = 14 + c * dx;
          const order = smooth(260, 760, x0);
          if (random() > 0.55 + order * 0.45) continue; // the mess has gaps
          if (y0 > 200 && x0 > 586 && x0 < 760) continue; // where Zee stands
          const chaos = 1 - order;
          const x = x0 + (random() - 0.5) * 70 * chaos;
          let y = y0 + (random() - 0.5) * 60 * chaos;
          // Keep the band around the title clear.
          if (y0 < 200) y = Math.min(y, 128);
          else y = Math.max(y, 272);
          const angle = (random() - 0.5) * 70 * chaos;
          // Sorted side: each run of columns is one kind. Messy side: any kind.
          const kind = order > 0.6 ? kinds[Math.floor(c / 2) % kinds.length] : kinds[Math.floor(random() * kinds.length)];
          const colored = random() < 0.3 + order * 0.62;

          const g = document.createElementNS(svg, "g");
          g.setAttribute("transform", `translate(${x} ${y}) rotate(${angle} ${W / 2} ${H / 2})`);
          const rect = document.createElementNS(svg, "rect");
          rect.setAttribute("width", W);
          rect.setAttribute("height", H);
          rect.setAttribute("rx", 4);
          rect.setAttribute("fill", colored ? kind : "#232a2f");
          rect.setAttribute("opacity", colored ? 0.9 : 1);
          g.appendChild(rect);
          for (const [ly, lw] of [[10, 14], [16, 16], [22, 10]]) {
            const line = document.createElementNS(svg, "rect");
            line.setAttribute("x", 6);
            line.setAttribute("y", ly);
            line.setAttribute("width", lw);
            line.setAttribute("height", 2);
            line.setAttribute("rx", 1);
            line.setAttribute("fill", colored ? "#15191c" : "#3a444b");
            line.setAttribute("opacity", colored ? 0.35 : 1);
            g.appendChild(line);
          }
          tiles.appendChild(g);
        }
      }

      // The scribble under the title straightens out as it moves right.
      const points = [];
      for (let x = 300; x <= 700; x += 4) {
        const chaos = 1 - smooth(330, 620, x);
        const y = 254 + chaos * (Math.sin(x * 0.085) * 8 + Math.sin(x * 0.23) * 3);
        points.push(`${x},${y.toFixed(1)}`);
      }
      document.getElementById("line").setAttribute("d", "M" + points.join(" L"));
    </script>
    <canvas id="robot"></canvas>
    <script type="module" src="../../app/ui/robot.js"></script>
  </body>
</html>
